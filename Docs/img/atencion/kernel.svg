<text x="36.0" y="66.0" font-size="12" fill="#5f5e5a" text-anchor="start" font-weight="400">Python y PyTorch</text>
<text x="36.0" y="92.0" font-size="12" fill="#1f1e1c" text-anchor="start" font-weight="400" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', monospace">torch.softmax(s, -1)</text>
<text x="36.0" y="118.0" font-size="12" fill="#5f5e5a" text-anchor="start" font-weight="400">elige el kernel y su grilla</text>
