  "gpt entrenar --tamaño m",
  "gpt evaluar --tamaño m",
]

[[trabajo]]
id = 18
opcional = true
nombre = "OPCIONAL: genie_m (entrenar, evaluar a 1, 2, 4, 8, 12 y 25 pasos)"
horas = 1.5
comandos = [
  "genie entrenar --tamaño m",
  "genie evaluar --tamaño m --pasos 1,2,4,8,12,25",
]

[[trabajo]]
id = 19
opcional = true
nombre = "OPCIONAL: maskgit_s propio y sus ablaciones (posición absoluta, máscara de Genie, sin p_clean), con 1, 2, 4, 8 y 12 pasos"
horas = 3.0
comandos = [
  "maskgit entrenar --tamaño s --set config.pos=frame --set config.p_clean=0.5",
  "maskgit entrenar --tamaño s --variante abs",
  "maskgit entrenar --tamaño s --variante genie --set config.pos=frame --set config.p_clean=0.5 --set config.mask_schedule=uniform",
  "maskgit entrenar --tamaño s --variante nopc --set config.pos=frame",
  "maskgit evaluar --tamaño s --pasos 1,2,4,8,12",
  "maskgit evaluar --tamaño s --variante abs --pasos 8",
  "maskgit evaluar --tamaño s --variante genie --pasos 8",
  "maskgit evaluar --tamaño s --variante nopc --pasos 8",
]
