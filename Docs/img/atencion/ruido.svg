<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 246" width="720" height="246" role="img" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>El ruido del muestreo, antes y ahora</title>
<desc>Con 128 llamadas, la CPU lanzaba el ruido de cada token antes del graph del frame y la GPU esperaba; con una sola llamada, el graph arranca enseguida.</desc>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><pattern id="rayas" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#8a8984" stroke-width="1.5"/></pattern></defs>
<rect x="0.5" y="0.5" width="719.0" height="245.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1" />
<text x="24.0" y="30.0" font-size="13" fill="#1f1e1c" text-anchor="start" font-weight="600">Antes: 128 llamadas a exponential_ por frame</text>
<text x="24.0" y="58.0" font-size="12" fill="#5f5e5a" text-anchor="start" font-weight="400">CPU</text>
<rect x="110.0" y="42.0" width="530.0" height="22.0" rx="3" fill="#e6e5df" />
<rect x="110.0" y="42.0" width="25.4" height="22.0" rx="0" fill="#8a8984" />
<text x="143.4" y="58.0" font-size="12" fill="#5f5e5a" text-anchor="start" font-weight="400">128 lanzamientos: ≈2,2 ms (diferencia entre los dos benches)</text>
<text x="24.0" y="88.0" font-size="12" fill="#5f5e5a" text-anchor="start" font-weight="400">GPU</text>
<rect x="110.0" y="72.0" width="530.0" height="22.0" rx="3" fill="#e6e5df" />
<rect x="135.4" y="72.0" width="436.7" height="22.0" rx="3" fill="#2a78d6" />
<text x="145.4" y="88.0" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600">graph del frame, ≈37,9 ms</text>
<text x="690.0" y="88.0" font-size="12" fill="#1f1e1c" text-anchor="end" font-weight="400">40,1 ms</text>
<text x="24.0" y="124.0" font-size="13" fill="#1f1e1c" text-anchor="start" font-weight="600">Ahora: una llamada a frame_noise</text>
<text x="24.0" y="152.0" font-size="12" fill="#5f5e5a" text-anchor="start" font-weight="400">CPU</text>
<rect x="110.0" y="136.0" width="530.0" height="22.0" rx="3" fill="#e6e5df" />
<rect x="110.0" y="136.0" width="3.0" height="22.0" rx="0" fill="#8a8984" />
<text x="121.0" y="152.0" font-size="12" fill="#5f5e5a" text-anchor="start" font-weight="400">1 lanzamiento</text>
<text x="24.0" y="182.0" font-size="12" fill="#5f5e5a" text-anchor="start" font-weight="400">GPU</text>
<rect x="110.0" y="166.0" width="530.0" height="22.0" rx="3" fill="#e6e5df" />
<rect x="110.9" y="166.0" width="436.7" height="22.0" rx="3" fill="#2a78d6" />
<text x="120.9" y="182.0" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600">graph del frame, ≈37,9 ms</text>
<text x="690.0" y="182.0" font-size="12" fill="#1f1e1c" text-anchor="end" font-weight="400">37,9 ms</text>
<line x1="110.0" y1="210.0" x2="640.0" y2="210.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/>
<line x1="110.0" y1="210.0" x2="110.0" y2="214.0" stroke="#8a8984" stroke-width="1" stroke-linecap="round"/>
<text x="110.0" y="227.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="400">0</text>
<line x1="225.2" y1="210.0" x2="225.2" y2="214.0" stroke="#8a8984" stroke-width="1" stroke-linecap="round"/>
<text x="225.2" y="227.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="400">10</text>
<line x1="340.4" y1="210.0" x2="340.4" y2="214.0" stroke="#8a8984" stroke-width="1" stroke-linecap="round"/>
<text x="340.4" y="227.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="400">20</text>
<line x1="455.7" y1="210.0" x2="455.7" y2="214.0" stroke="#8a8984" stroke-width="1" stroke-linecap="round"/>
<text x="455.7" y="227.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="400">30</text>
<line x1="570.9" y1="210.0" x2="570.9" y2="214.0" stroke="#8a8984" stroke-width="1" stroke-linecap="round"/>
<text x="570.9" y="227.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="400">40 ms</text>
</svg>
