<text x="36.0" y="206.0" font-size="14" fill="#1f1e1c" text-anchor="start" font-weight="600">1 bloque</text>
<text x="36.0" y="226.0" font-size="12" fill="#5f5e5a" text-anchor="start" font-weight="400">hasta 1024 hilos</text>
<text x="36.0" y="244.0" font-size="12" fill="#5f5e5a" text-anchor="start" font-weight="400">mismo código; cada hilo</text>
<text x="36.0" y="262.0" font-size="12" fill="#5f5e5a" text-anchor="start" font-weight="400">con otra parte de los datos</text>
